name: Prueba secret vs variable local

on: push

jobs:
  comprobar-token:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN (secret) con LOCAL_DEV_TOKEN (variable local)
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $local = [Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'User')
          if (-not $local) { $local = [Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'Machine') }
          Write-Host "Runner: $env:RUNNER_NAME - Rama: $env:GITHUB_REF_NAME"
          if ($env:DEV_TOKEN -eq $local) {
            Write-Host "OK: DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
          } else {
            Write-Host "ERROR: DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN"
            exit 1
          }
